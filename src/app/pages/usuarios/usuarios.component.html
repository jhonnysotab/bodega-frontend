<div class="page">

  <!-- Header -->
  <div class="page-header">
    <div>
      <h2>Usuarios</h2>
      <p>Gestión de usuarios del sistema</p>
    </div>
    <p-button
      label="Nuevo usuario"
      icon="pi pi-plus"
      styleClass="btn-primary"
      (onClick)="abrirDialogCrear()"
      *ngIf="isAdmin"
    />
  </div>

  <!-- Tabla -->
  <div class="table-card">
    <p-table
      [value]="usuarios"
      [loading]="loading"
      [paginator]="true"
      [rows]="10"
      [rowsPerPageOptions]="[5, 10, 25]"
      [globalFilterFields]="['nombre','username','rol']"
      dataKey="id"
      styleClass="p-datatable-sm"
      #dt
    >
      <!-- Toolbar -->
      <ng-template pTemplate="caption">
        <div class="table-toolbar">
          <p-iconfield>
            <p-inputicon styleClass="pi pi-search" />
            <input
              pInputText
              type="text"
              placeholder="Buscar usuario..."
              (input)="dt.filterGlobal($any($event.target).value, 'contains')"
            />
          </p-iconfield>
        </div>
      </ng-template>

      <!-- Cabecera -->
      <ng-template pTemplate="header">
        <tr>
          <th pSortableColumn="nombre">Nombre <p-sortIcon field="nombre" /></th>
          <th pSortableColumn="username">Usuario <p-sortIcon field="username" /></th>
          <th pSortableColumn="rol">Rol <p-sortIcon field="rol" /></th>
          <th>Estado</th>
          <th style="width: 130px; text-align:center">Acciones</th>
        </tr>
      </ng-template>

      <!-- Filas -->
      <ng-template pTemplate="body" let-u>
        <tr>
          <td>
            <div class="user-cell">
              <p-avatar [label]="u.nombre.charAt(0)" shape="circle" styleClass="row-avatar" />
              <span>{{ u.nombre }}</span>
            </div>
          </td>
          <td>
            <span class="username-badge">{{ u.username }}</span>
          </td>
          <td>
            <p-tag
              [value]="u.rol"
              [severity]="u.rol === 'ADMIN' ? 'warn' : 'secondary'"
              styleClass="rol-tag"
            />
          </td>
          <td>
            <p-tag
              [value]="u.activo ? 'Activo' : 'Inactivo'"
              [severity]="u.activo ? 'success' : 'danger'"
            />
          </td>
          <td>
            <div class="action-btns">
              <p-button
                icon="pi pi-pencil"
                styleClass="btn-action edit"
                pTooltip="Editar"
                tooltipPosition="top"
                (onClick)="abrirDialogEditar(u)"
              />
              <p-button
                [icon]="u.activo ? 'pi pi-ban' : 'pi pi-check-circle'"
                styleClass="btn-action toggle"
                [pTooltip]="u.activo ? 'Desactivar' : 'Activar'"
                tooltipPosition="top"
                (onClick)="toggleEstado(u)"
              />
              <p-button
                icon="pi pi-trash"
                styleClass="btn-action delete"
                pTooltip="Eliminar"
                tooltipPosition="top"
                (onClick)="confirmarEliminar(u)"
                *ngIf="isAdmin"
              />
            </div>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="5">
            <div class="empty-state">
              <i class="pi pi-users"></i>
              <span>No hay usuarios registrados</span>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>

</div>

<!-- ── DIALOG CREAR / EDITAR ─────────────────────────────── -->
<p-dialog
  [(visible)]="dialogVisible"
  [header]="editMode ? 'Editar usuario' : 'Nuevo usuario'"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  styleClass="user-dialog"
  [style]="{ width: '460px' }"
>
  <form [formGroup]="usuarioForm" (ngSubmit)="guardar()" novalidate>

    <!-- Nombre -->
    <div class="field-group">
      <label>Nombre completo</label>
      <p-iconfield class="w-full">
        <p-inputicon styleClass="pi pi-user" />
        <input pInputText formControlName="nombre" placeholder="Ej: Juan Pérez" class="w-full"
          [class.ng-invalid]="hasError('nombre')" [class.ng-dirty]="hasError('nombre')" />
      </p-iconfield>
      <small class="p-error" *ngIf="hasError('nombre')">El nombre es obligatorio</small>
    </div>

    <!-- Username -->
    <div class="field-group">
      <label>Nombre de usuario</label>
      <p-iconfield class="w-full">
        <p-inputicon styleClass="pi pi-at" />
        <input pInputText formControlName="username" placeholder="Ej: jperez" class="w-full"
          [class.ng-invalid]="hasError('username')" [class.ng-dirty]="hasError('username')" />
      </p-iconfield>
      <small class="p-error" *ngIf="hasError('username')">Mínimo 3 caracteres</small>
    </div>

    <!-- Password (solo en crear) -->
    <div class="field-group" *ngIf="!editMode">
      <label>Contraseña</label>
      <p-iconfield class="w-full">
        <p-inputicon styleClass="pi pi-lock" />
        <input pInputText [type]="showPass ? 'text' : 'password'" formControlName="password"
          placeholder="Mínimo 6 caracteres" class="w-full"
          [class.ng-invalid]="hasError('password')" [class.ng-dirty]="hasError('password')" />
      </p-iconfield>
      <button type="button" class="toggle-eye" (click)="showPass = !showPass">
        <i [class]="showPass ? 'pi pi-eye-slash' : 'pi pi-eye'"></i>
      </button>
      <small class="p-error" *ngIf="hasError('password')">Mínimo 6 caracteres</small>
    </div>

    <!-- Rol -->
    <div class="field-group">
      <label>Rol</label>
      <p-select
        formControlName="rol"
        [options]="roles"
        optionLabel="label"
        optionValue="value"
        placeholder="Seleccionar rol"
        styleClass="w-full"
      />
      <small class="p-error" *ngIf="hasError('rol')">Selecciona un rol</small>
    </div>

    <!-- Error servidor -->
    <p-message *ngIf="serverError" severity="error" [text]="serverError" styleClass="w-full" />

  </form>

  <ng-template pTemplate="footer">
    <p-button label="Cancelar" icon="pi pi-times" styleClass="btn-cancel" (onClick)="cerrarDialog()" />
    <p-button
      [label]="editMode ? 'Guardar cambios' : 'Crear usuario'"
      icon="pi pi-check"
      styleClass="btn-primary"
      [loading]="saving"
      (onClick)="guardar()"
    />
  </ng-template>
</p-dialog>

<!-- ── CONFIRM DIALOG ────────────────────────────────────── -->
<p-confirmDialog styleClass="confirm-dialog" />
<p-toast position="top-right" />
